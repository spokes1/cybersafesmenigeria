# Static site: no build step, no dependencies.
# `public` is intentionally a repo-relative path — never an absolute one
# such as "/public" or "/opt/build/repo/public". Netlify strips the leading
# slash and then resolves the remainder from the repo root, which produces a
# path that does not exist and fails the deploy with
# "Deploy directory ... does not exist".
# Settings in this file take precedence over the Netlify UI publish directory.
[build]
  publish = "public"

# Retired duplicate resource directories. Netlify handles these redirects;
# no replacement HTML is generated. Verify slash variants on hosted staging.
[[redirects]]
  from = "/resources/checklists"
  to = "/resources/downloads"
  status = 301

[[redirects]]
  from = "/resources/checklists/"
  to = "/resources/downloads"
  status = 301

[[redirects]]
  from = "/resources/guides"
  to = "/learn"
  status = 301

[[redirects]]
  from = "/resources/guides/"
  to = "/learn"
  status = 301

# Retired Audio Guide: redirect both URL forms to the written basics guide.
# The Audio Guide HTML and audio media are no longer published.
[[redirects]]
  from = "/resources/audio-guide"
  to = "/learn/cybersecurity-basics"
  status = 301

[[redirects]]
  from = "/resources/audio-guide/"
  to = "/learn/cybersecurity-basics"
  status = 301

# Security headers for every page.
# The site loads no third-party scripts. Google Fonts is the only outside
# host it uses (stylesheet from fonts.googleapis.com, files from fonts.gstatic.com).
# 'unsafe-inline' is for style only: a few pages use inline style attributes.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self'; connect-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'"

# Cache. Images and icons keep their filenames when they are replaced, so they
# get a week, not a year. CSS and JS are not fingerprinted, so they keep
# Netlify's default (always check for a newer copy) to avoid stale styles.
[[headers]]
  for = "/assets/photos/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/assets/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/assets/logo/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# One About page. Preserve bookmarked legacy URLs and their slash variants.
[[redirects]]
  from = "/about/mission"
  to = "/about#mission"
  status = 301
  force = true
[[redirects]]
  from = "/about/mission/"
  to = "/about#mission"
  status = 301
  force = true
[[redirects]]
  from = "/about/team"
  to = "/about#team"
  status = 301
  force = true
[[redirects]]
  from = "/about/team/"
  to = "/about#team"
  status = 301
  force = true
[[redirects]]
  from = "/about/contact"
  to = "/about#contact"
  status = 301
  force = true
[[redirects]]
  from = "/about/contact/"
  to = "/about#contact"
  status = 301
  force = true

# Production primary domain. Activate www.cybersafesme.org in Netlify's
# domain settings and configure DNS separately before production rollout.
[[redirects]]
  from = "https://cybersafesme.org/*"
  to = "https://www.cybersafesme.org/:splat"
  status = 301
  force = true
[[redirects]]
  from = "https://cybersafesmenigeria.netlify.app/*"
  to = "https://www.cybersafesme.org/:splat"
  status = 301
  force = true

# Retired Privacy Policy: the owner requested removal; preserve old bookmarks.
[[redirects]]
  from = "/privacy"
  to = "/about"
  status = 301
  force = true
[[redirects]]
  from = "/privacy/"
  to = "/about"
  status = 301
  force = true
